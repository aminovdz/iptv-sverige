<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#06080e" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <rect width="900" height="500" rx="24" fill="url(#devBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- TV Monitor (Center-Back) -->
  <g transform="translate(180, 50)">
    <rect x="0" y="0" width="540" height="300" rx="16" fill="#020408" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
    <rect x="12" y="12" width="516" height="276" rx="10" fill="url(#screenGrad)" />
    <!-- TV Screen Content -->
    <rect x="30" y="30" width="120" height="28" rx="6" fill="#10b981" />
    <text x="45" y="49" font-family="Inter, sans-serif" font-size="13" font-weight="900" fill="#020408">LIVE 4K • 60 FPS</text>
    <text x="30" y="100" font-family="Outfit, Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Live Sport &amp; SPORT 4K</text>
    <text x="30" y="130" font-family="Inter, sans-serif" font-size="15" fill="#94a3b8">Direktsänd sport i kristallklar bildkvalitet</text>
    
    <!-- TV Stand -->
    <path d="M230 300 L210 350 L330 350 L310 300 Z" fill="#1e293b" />
    <rect x="190" y="348" width="160" height="8" rx="4" fill="#334155" />
  </g>

  <!-- Tablet / iPad (Left-Front) -->
  <g transform="translate(60, 180)">
    <rect x="0" y="0" width="220" height="280" rx="20" fill="#050811" stroke="#334155" stroke-width="4" />
    <rect x="10" y="10" width="200" height="260" rx="12" fill="rgba(16,185,129,0.15)" />
    <text x="25" y="45" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Apple TV / iPad</text>
    <text x="25" y="70" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">iPlayTV &amp; TiviMate</text>
    <circle cx="110" cy="150" r="30" fill="#10b981" opacity="0.8" />
    <polygon points="103,138 123,150 103,162" fill="#020408" />
  </g>

  <!-- Smartphone (Right-Front) -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="130" height="260" rx="24" fill="#050811" stroke="#334155" stroke-width="4" />
    <rect x="8" y="8" width="114" height="244" rx="18" fill="rgba(245,158,11,0.15)" />
    <rect x="45" y="14" width="40" height="6" rx="3" fill="#334155" />
    <text x="20" y="60" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Mobil App</text>
    <text x="20" y="80" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8">iOS / Android</text>
  </g>
</svg>