<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#06060b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Emerald-to-Cyan Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Screen Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#neonGlow)" stroke-width="12" />

  <!-- Subtle Nordic / Swedish Flag Mini Corner Accent -->
  <g transform="translate(380, 48)">
    <rect width="64" height="40" rx="8" fill="#006aa7" />
    <rect x="18" y="0" width="10" height="40" fill="#fecc00" />
    <rect x="0" y="15" width="64" height="10" fill="#fecc00" />
  </g>

  <!-- Holographic TV / Display Bezel Frame -->
  <rect x="76" y="96" width="360" height="250" rx="36" fill="#030712" stroke="url(#neonGlow)" stroke-width="10" filter="url(#softGlow)" />

  <!-- TV Screen Inner Gradient Display -->
  <rect x="92" y="112" width="328" height="218" rx="24" fill="#090d16" />

  <!-- Broadcast Signal Waves (Top of TV) -->
  <path d="M216 76 C236 60, 276 60, 296 76" fill="none" stroke="url(#neonGlow)" stroke-width="8" stroke-linecap="round" />
  <path d="M192 56 C228 32, 284 32, 320 56" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Center PRO Dynamic Play / Stream Prism Symbol -->
  <g filter="url(#glow)">
    <polygon points="225,165 335,221 225,277" fill="url(#goldGrad)" />
    <!-- Inner Play Highlight -->
    <polygon points="235,185 305,221 235,257" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- TV Stand Base with Neon Reflection -->
  <path d="M210 346 L200 396 L312 396 L302 346" fill="#0f172a" stroke="url(#neonGlow)" stroke-width="8" />
  <rect x="160" y="396" width="192" height="16" rx="8" fill="url(#neonGlow)" filter="url(#softGlow)" />

  <!-- 4K UHD Pro Badge at Bottom of Screen -->
  <g transform="translate(196, 290)">
    <rect width="120" height="26" rx="6" fill="#10b981" />
    <text x="60" y="18" fill="#022c22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1.5">4K ULTRA HD</text>
  </g>
</svg>
