<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#141428" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#appBg)" />
  <circle cx="400" cy="180" r="90" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="3" />
  <!-- Smartphone Graphic -->
  <rect x="365" y="120" width="70" height="120" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="400" cy="225" r="4" fill="#fbbf24" />
  <!-- TV Monitor Graphic behind -->
  <rect x="420" y="140" width="90" height="60" rx="8" fill="none" stroke="#10b981" stroke-width="4" />

  <text x="400" y="320" font-family="Outfit, Inter, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Bästa IPTV Appen 2026</text>
  <text x="400" y="360" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Topp 5 appar för Android TV, Samsung, LG och Apple TV</text>
</svg>