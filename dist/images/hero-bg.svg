<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b" />
      <stop offset="50%" stop-color="#0e1713" />
      <stop offset="100%" stop-color="#06060b" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#059669" opacity="0.12" filter="url(#glow)" />
  <circle cx="950" cy="150" r="140" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="1160" height="590" rx="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Badge -->
  <rect x="80" y="90" width="340" height="42" rx="21" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" />
  <text x="100" y="117" font-family="Inter, sans-serif" font-size="15" font-weight="bold" fill="#34d399">🇸🇪 SVERIGES #1 IPTV-TJÄNST 2026</text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="Outfit, Inter, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    IPTV Sverige
  </text>
  <text x="80" y="280" font-family="Outfit, Inter, sans-serif" font-size="52" font-weight="800" fill="url(#primary)" letter-spacing="-1">
    Svensk TV &amp; Sport i 4K &amp; 8K
  </text>

  <!-- Description Paragraph -->
  <text x="80" y="340" font-family="Inter, sans-serif" font-size="22" fill="#94a3b8">
    Live Sport, Ishockey, SPORT 4K och internationell underhållning i 60 FPS utan buffring.
  </text>
  <text x="80" y="375" font-family="Inter, sans-serif" font-size="22" fill="#94a3b8">
    Stödjer Swish, Klarna och alla Smart TV-appar.
  </text>

  <!-- Feature Tags -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="220" height="46" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✓ Anti-Freeze 9.0</text>

    <rect x="240" y="0" width="220" height="46" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="264" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✓ Svensk EPG Tablå</text>

    <rect x="480" y="0" width="220" height="46" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="504" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">✓ Betala med Swish</text>

    <rect x="720" y="0" width="220" height="46" rx="14" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" />
    <text x="744" y="28" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#fbbf24">⚡ Från 75 kr/mån</text>
  </g>

  <!-- Rating Footer -->
  <text x="80" y="550" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#64748b">
    ⭐ 4.9/5 i betyg från över 1 450 svenska användare · iptv-sverige.org
  </text>
</svg>